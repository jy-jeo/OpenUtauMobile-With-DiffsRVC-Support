name: Simple Android APK

push:
  workflow_dispatch: # Lets you click "Run workflow" manually whenever you want

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code & submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Change to 8.0.x if your csproj uses net8.0-android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build & Sign APK
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -o ./output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-APK
          path: ./output/*-Signed.apk
          
