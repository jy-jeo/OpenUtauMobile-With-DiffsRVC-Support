name: Simple Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code & submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android workload
        run: sudo dotnet workload install android
      - name: Restore signing keystore
        run: |
         echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release-key.jks"
        env:
         ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build & Sign APK
        run: |
         dotnet publish OpenUtauMobile.Android/OpenUtauMobile.Android.csproj \
         -f net10.0-android36.0 \
         -c Release \
         -p:AndroidPackageFormat=apk \
         -p:AndroidKeyStore=true \
         -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/release-key.jks" \
         -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
         -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
         -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
         -o ./output
        env:
         ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
         ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
         ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-APK
          path: ./output/*-Signed.apk
          
