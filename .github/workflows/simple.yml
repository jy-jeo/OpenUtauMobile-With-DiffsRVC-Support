name: Simple Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code & submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin .NET 8 SDK
        run: dotnet new globaljson --sdk-version 8.0.400 --roll-forward latestPatch --force

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore & Build APK
        run: |
          dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:CheckEolTargetFramework=false
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net8.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:CheckEolTargetFramework=false \
            -o ./output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-APK
          path: ./output/*-Signed.apk
          
